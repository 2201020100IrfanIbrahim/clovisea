{% extends "base.html" %}
{% block title %}Lokasi Penelitian · Clovisea{% endblock %}
{% block content %}
<div class="section-label rise">Lokasi Penelitian</div>
<h1 class="display rise" style="font-size:clamp(1.8rem,6vw,2.6rem);margin-bottom:1.1rem">{{ loc.nama }}</h1>
<img class="hero-media rise" src="{{ url_for('static', filename='img/bintan_map.jpg') }}" alt="Peta Pulau Bintan"
     onerror="this.src='';this.style.background='linear-gradient(135deg,#a9d4e8,#4f8fb8)'">
<div class="card panel rise" style="margin-top:1rem">
  <h3><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg> Tentang Lokasi</h3>
  <p>{{ loc.desc }}</p>
</div>
{% endblock %}
